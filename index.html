<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation: BIRTHDAY BARRAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --wot-orange: #ff9600;
            --wot-grey: #1f1f1f;
            --wot-dark: #0a0a0a;
            --wot-text: #e0e0e0;
            --wot-red: #ff3333;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--wot-dark);
            color: var(--wot-text);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Lớp phủ nháy sáng khi nổ súng */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.05s;
        }

        .panel {
            position: relative;
            z-index: 10;
            width: 700px; max-width: 90%;
            background: var(--wot-grey);
            border: 2px solid #555;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        .panel::before {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-top: 4px solid var(--wot-orange);
            border-bottom: 4px solid var(--wot-orange);
            opacity: 0.8; pointer-events: none;
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 3rem; color: var(--wot-orange);
            text-transform: uppercase; margin: 0;
            text-shadow: 2px 2px 0px black;
            border-bottom: 1px solid #444; padding-bottom: 20px;
        }

        .countdown-container {
            display: flex; justify-content: center; gap: 20px;
            margin: 30px 0; background: rgba(0,0,0,0.3);
            padding: 20px; border: 1px solid #444;
        }

        .time-val { font-size: 2.5rem; font-weight: bold; color: #fff; }
        .time-label { font-size: 0.8rem; color: var(--wot-orange); }

        .fire-btn {
            background: #8b0000; color: white;
            font-family: 'Black Ops One', cursive; font-size: 1.5rem;
            padding: 20px 60px; border: none; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: 0.1s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .fire-btn:active { transform: scale(0.95); background: #ff0000; }
        .fire-btn:disabled { background: #333; cursor: not-allowed; color: #777; }

        #mission-report {
            display: none; margin-top: 30px;
            border-top: 1px dashed #555; padding-top: 20px;
        }

        /* Animation rung lắc dữ dội */
        .shake-hard { animation: shake 0.1s infinite; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .log-console {
            text-align: left; font-size: 0.8rem;
            color: var(--wot-orange); font-family: monospace;
            margin-top: 10px; height: 60px; overflow: hidden;
            border-left: 2px solid var(--wot-orange);
            padding-left: 10px; opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div class="panel" id="main-panel">
        <div style="position:absolute; top:10px; right:10px; font-size:0.7rem; color:var(--wot-orange)">SYS.BARRAGE.MODE</div>
        
        <h1 id="user-name">COMMANDER [TÊN BẠN]</h1>
        <div style="color:#888; margin-top:5px; letter-spacing:2px">Artillery Support Requested</div>

        <div class="countdown-container">
            <div class="time-box"><div class="time-val" id="d">00</div><div class="time-label">DAYS</div></div>
            <div class="time-box"><div class="time-val" id="h">00</div><div class="time-label">HOURS</div></div>
            <div class="time-box"><div class="time-val" id="m">00</div><div class="time-label">MINS</div></div>
            <div class="time-box"><div class="time-val" id="s">00</div><div class="time-label">SECS</div></div>
        </div>

        <div class="log-console" id="battle-log">
            > SYSTEM READY...<br>
            > AWAITING FIRE COMMAND...
        </div>

        <br>
        <button class="fire-btn" onclick="startBarrage()">GỌI PHÁO KÍCH (FIRE)!</button>

        <div id="mission-report">
            <h2 style="color:white; font-family:'Black Ops One'">MISSION ACCOMPLISHED</h2>
            <p style="font-size:1.1rem; line-height:1.6; color:var(--wot-orange)">
                Mục tiêu đã bị tiêu diệt!<br>
                Chúc mừng sinh nhật Chỉ huy.<br>
                Năm nay chúc bạn: <b style="color:white">Giáp Mặt Dày - Đạn Xuyên Phá - RNG Luôn Độ!</b>
            </p>
        </div>
    </div>

    <script>
        // --- 1. CẤU HÌNH ---
        // Link âm thanh tiếng nổ (Dùng link online ổn định hoặc thay bằng file máy bạn)
        const EXPLOSION_URL = "https://www.soundjay.com/mechanical/sounds/explosion-02.mp3";
        // Ngày sinh nhật
        const birthdayTarget = new Date("October 20, 2024 00:00:00").getTime(); 

        // --- 2. HỆ THỐNG ÂM THANH ĐA CỠ NÒNG ---
        function playDynamicSound() {
            const audio = new Audio(EXPLOSION_URL);
            
            // Random cỡ nòng (Pitch)
            // 0.5 (Trầm/To) -> 2.0 (Cao/Nhỏ)
            const pitch = (Math.random() * 1.5) + 0.5; 
            
            // Random âm lượng để tạo chiều sâu không gian
            const volume = (Math.random() * 0.5) + 0.5;

            audio.mozPreservesPitch = false;
            audio.webkitPreservesPitch = false;
            audio.playbackRate = pitch; // Chỉnh méo tiếng
            audio.volume = volume;
            
            audio.play().catch(e => console.log("Cần tương tác trang web để phát âm thanh"));
        }

        // --- 3. HỆ THỐNG HÌNH ẢNH ---
        const panel = document.getElementById('main-panel');
        const flash = document.getElementById('flash-overlay');
        const log = document.getElementById('battle-log');
        const report = document.getElementById('mission-report');
        const btn = document.querySelector('.fire-btn');

        function visualImpact() {
            // Chớp màn hình
            flash.style.opacity = '0.8';
            setTimeout(() => { flash.style.opacity = '0'; }, 50);

            // Thêm log chiến đấu
            const calibers = ["152mm", "122mm", "105mm", "88mm", "75mm"];
            const randomCal = calibers[Math.floor(Math.random() * calibers.length)];
            log.innerHTML = `> FIRED: ${randomCal} HE SHELL... DIRECT HIT!<br>` + log.innerHTML;
        }

        // --- 4. KỊCH BẢN PHÁO KÍCH (BARRAGE) ---
        function startBarrage() {
            btn.disabled = true;
            btn.innerText = "FIRING...";
            panel.classList.add('shake-hard'); // Rung liên tục

            let shotsFired = 0;
            const totalShots = 15; // Tổng số phát bắn

            // Tạo vòng lặp bắn
            const barrageInterval = setInterval(() => {
                playDynamicSound(); // Bùm!
                visualImpact();     // Chớp!
                shotsFired++;

                if (shotsFired >= totalShots) {
                    clearInterval(barrageInterval);
                    finishMission();
                }
            }, 200); // 200ms một phát (Rất nhanh)
        }

        function finishMission() {
            panel.classList.remove('shake-hard');
            btn.innerText = "RELOADING...";
            btn.style.background = "#333";
            
            // Âm thanh xác nhận cuối cùng (Pitch thấp - Pháo hạng nặng chốt hạ)
            setTimeout(() => {
                const finalShot = new Audio(EXPLOSION_URL);
                finalShot.playbackRate = 0.5; // Rất trầm
                finalShot.play();
                visualImpact();
                
                // Hiện lời chúc
                setTimeout(() => {
                    report.style.display = 'block';
                    log.innerHTML = `> TARGET DESTROYED.<br>` + log.innerHTML;
                }, 800);
            }, 500);
        }

        // --- 5. BỘ ĐẾM THỜI GIAN (GIỮ NGUYÊN) ---
        setInterval(function() {
            const now = new Date().getTime();
            const distance = birthdayTarget - now;
            if (distance < 0) {
                document.querySelectorAll('.time-val').forEach(el => el.innerText = "00");
                return;
            }
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("d").innerText = d < 10 ? "0" + d : d;
            document.getElementById("h").innerText = h < 10 ? "0" + h : h;
            document.getElementById("m").innerText = m < 10 ? "0" + m : m;
            document.getElementById("s").innerText = s < 10 ? "0" + s : s;
        }, 1000);
    </script>
</body>
</html>
