<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOT: BIRTHDAY BARRAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --wot-orange: #ff9600;
            --wot-grey: #1f1f1f;
            --wot-dark: #0a0a0a;
            --wot-text: #e0e0e0;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--wot-dark);
            color: var(--wot-text);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Flash màn hình */
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 999;
            transition: opacity 0.05s;
        }

        .panel {
            position: relative; z-index: 10;
            width: 700px; max-width: 90%;
            background: var(--wot-grey);
            border: 2px solid #444;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            padding: 30px;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            text-align: center;
        }

        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-top: 4px solid var(--wot-orange);
            border-bottom: 4px solid var(--wot-orange);
            opacity: 0.8; pointer-events: none;
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 2.8rem; color: var(--wot-orange);
            text-transform: uppercase; margin: 0;
            text-shadow: 2px 2px 0px black;
            border-bottom: 1px solid #444; padding-bottom: 15px;
        }

        .countdown-container {
            display: flex; justify-content: center; gap: 15px;
            margin: 20px 0; background: rgba(0,0,0,0.4);
            padding: 15px; border: 1px solid #444;
        }

        .time-val { font-size: 2.5rem; font-weight: bold; color: #fff; }
        .time-label { font-size: 0.7rem; color: var(--wot-orange); }

        .fire-btn {
            background: #8b0000; color: white;
            font-family: 'Black Ops One', cursive; font-size: 1.5rem;
            padding: 15px 50px; border: none; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: 0.2s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .fire-btn:hover { background: #ff0000; transform: scale(1.05); }
        .fire-btn:active { transform: scale(0.95); }
        .fire-btn:disabled { background: #333; cursor: not-allowed; color: #777; transform: none; }

        #mission-report {
            display: none; margin-top: 20px;
            border-top: 1px dashed #555; padding-top: 15px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }

        /* Rung lắc */
        .shake-hard { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .log-console {
            text-align: left; font-size: 0.75rem;
            color: var(--wot-orange); font-family: monospace;
            margin-top: 10px; height: 80px; overflow-y: auto;
            border-left: 2px solid var(--wot-orange);
            padding-left: 10px; background: rgba(0,0,0,0.2);
        }
        /* Thanh cuộn kiểu game */
        .log-console::-webkit-scrollbar { width: 5px; }
        .log-console::-webkit-scrollbar-thumb { background: var(--wot-orange); }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>
    <div class="panel" id="main-panel">
        <div style="position:absolute; top:10px; right:10px; font-size:0.6rem; color:var(--wot-orange); opacity:0.6">SYS.V3.RELOADED</div>
        
        <h1 id="user-name">COMMANDER [TÊN BẠN]</h1>
        
        <div class="countdown-container">
            <div class="time-box"><div class="time-val" id="d">00</div><div class="time-label">DAYS</div></div>
            <div class="time-box"><div class="time-val" id="h">00</div><div class="time-label">HOURS</div></div>
            <div class="time-box"><div class="time-val" id="m">00</div><div class="time-label">MINS</div></div>
            <div class="time-box"><div class="time-val" id="s">00</div><div class="time-label">SECS</div></div>
        </div>

        <div class="log-console" id="battle-log">
            > SYSTEM INITIALIZED...<br>
            > AMMUNITION LOADED.<br>
            > WAITING FOR ORDER...
        </div>

        <button class="fire-btn" onclick="startBarrage()" id="fire-btn">KHAI HỎA!</button>

        <div id="mission-report">
            <h2 style="color:white; margin:10px 0; font-family:'Black Ops One'">TARGET DESTROYED!</h2>
            <p style="font-size:1rem; color:#ccc;">
                Chúc mừng sinh nhật!<br>
                <span style="color:var(--wot-orange)">RNG đã đứng về phía bạn.</span><br>
                Năm mới bách phát bách trúng!
            </p>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH NGÀY SINH NHẬT ---
        const birthdayTarget = new Date("October 20, 2024 00:00:00").getTime(); 

        // --- CẤU HÌNH ÂM THANH (Dán link mp3 của bạn vào đây) ---
        // Bạn có thể thêm bao nhiêu link tùy thích, cách nhau bởi dấu phẩy
        const AUDIO_SOURCES = [
            "https://www.soundjay.com/mechanical/sounds/explosion-02.mp3",
            // Ví dụ: thêm file khác nếu bạn có
            // "mysounds/tank_fire_1.mp3",
            // "mysounds/tank_fire_2.mp3" 
        ];

        // --- HỆ THỐNG XỬ LÝ ---
        const panel = document.getElementById('main-panel');
        const flash = document.getElementById('flash-overlay');
        const log = document.getElementById('battle-log');
        const report = document.getElementById('mission-report');
        const btn = document.getElementById('fire-btn');

        function playRandomSound() {
            // 1. Chọn ngẫu nhiên 1 file từ danh sách
            const randomSrc = AUDIO_SOURCES[Math.floor(Math.random() * AUDIO_SOURCES.length)];
            const audio = new Audio(randomSrc);
            
            // 2. Chỉnh méo tiếng ngẫu nhiên (Pitch & Volume)
            audio.mozPreservesPitch = false;
            audio.webkitPreservesPitch = false;
            audio.playbackRate = (Math.random() * 1.2) + 0.6; // Tốc độ từ 0.6x đến 1.8x
            audio.volume = (Math.random() * 0.4) + 0.6;       // Volume to nhỏ khác nhau
            
            audio.play().catch(e => console.log("Audio blocked"));
        }

        function addLog(text) {
            log.innerHTML += `> ${text}<br>`;
            log.scrollTop = log.scrollHeight; // Tự cuộn xuống dưới
        }

        function startBarrage() {
            // Reset trạng thái nếu bắn lần 2
            report.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "FIRING...";
            panel.classList.add('shake-hard');
            addLog("BARRAGE STARTED! FIRE FOR EFFECT!");

            let shots = 0;
            const maxShots = 12; // Số phát bắn mỗi lần ấn nút

            const interval = setInterval(() => {
                playRandomSound();
                
                // Hiệu ứng chớp
                flash.style.opacity = '0.8';
                setTimeout(() => flash.style.opacity = '0', 50);

                // Log ngẫu nhiên
                const shells = ["AP", "HE", "APCR", "HEAT"];
                const shell = shells[Math.floor(Math.random() * shells.length)];
                addLog(`FIRED ${shell} SHELL... HIT!`);

                shots++;
                if (shots >= maxShots) {
                    clearInterval(interval);
                    finishBarrage();
                }
            }, 250); // Tốc độ bắn
        }

        function finishBarrage() {
            panel.classList.remove('shake-hard');
            addLog("TARGET NEUTRALIZED. CEASE FIRE.");
            
            // Chốt hạ
            setTimeout(() => {
                playRandomSound(); // Bùm phát cuối
                report.style.display = 'block';
                
                // --- CHẾ ĐỘ RELOAD (QUAN TRỌNG) ---
                btn.innerText = "RELOADING...";
                
                // Sau 3 giây sẽ cho phép bắn lại
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "GỌI PHÁO KÍCH (FIRE)";
                    btn.style.background = "#8b0000";
                    addLog("READY TO FIRE AGAIN.");
                }, 3000);

            }, 600);
        }

        // --- BỘ ĐẾM GIỜ ---
        setInterval(function() {
            const now = new Date().getTime();
            const dist = birthdayTarget - now;
            if (dist < 0) { document.querySelectorAll('.time-val').forEach(el => el.innerText = "00"); return; }
            document.getElementById("d").innerText = Math.floor(dist / (1000 * 60 * 60 * 24)).toString().padStart(2,'0');
            document.getElementById("h").innerText = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2,'0');
            document.getElementById("m").innerText = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2,'0');
            document.getElementById("s").innerText = Math.floor((dist % (1000 * 60)) / 1000).toString().padStart(2,'0');
        }, 1000);
    </script>
</body>
</html>
